name: "Publicador Diário: Agente Multi-IA LinkedIn"on:schedule:# O Cron do GitHub Actions roda em UTC.# 06:33 UTC corresponde a exatas 03:33 da manhã no Horário de Brasília (BRT - UTC-3).- cron: '33 6 * * *'A diretiva workflow_dispatch cria um botão na interface do GitHubpara você testar ou rodar o bot manualmente quando quiser, sem precisar esperar as 03h33.workflow_dispatch:jobs:run-linkedin-ai-bot:runs-on: ubuntu-lateststeps:
  - name: Checkout do Repositório
    uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'
      cache: 'pip' # Acelera a execução cacheando dependências

  - name: Instalar Dependências
    run: |
      python -m pip install --upgrade pip
      pip install requests google-generativeai typing_extensions

  - name: Executar Agentes de IA e Publicar
    env:
      # Mapeamento de Credenciais Sensíveis (Puxadas do GitHub Secrets)
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_URN_ID: ${{ secrets.LINKEDIN_URN_ID }}
      SENHA_APP_GMAIL: ${{ secrets.SENHA_APP_GMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: curador-govorc-organizacao.py
