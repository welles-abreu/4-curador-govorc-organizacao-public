name: "Publicador Diário: Agente Multi-IA LinkedIn"

on:
  schedule:
    # 06:39 UTC corresponde a 03:39 no Horário de Brasília (BRT)
    - cron: '39 6 * * *'
  workflow_dispatch:

jobs:
  run-linkedin-ai-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai typing_extensions

      - name: Executar Agentes de IA e Publicar
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_URN_ID: ${{ secrets.LINKEDIN_URN_ID }}
          SENHA_APP_GMAIL: ${{ secrets.SENHA_APP_GMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python curador-govorc-organizacao.py
